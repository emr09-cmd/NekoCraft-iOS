name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download ARM64 iOS Java 21 runtime
        run: make -C Runtime ios-jre21

      - name: Archive app
        run: |
          xcodebuild archive \
            -project NekoCraft.xcodeproj \
            -scheme NekoCraft \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/NekoCraft.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/NekoCraft.xcarchive/Products/Applications/NekoCraft.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r NekoCraft.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NekoCraft-ipa
          path: ${{ runner.temp }}/NekoCraft.ipa